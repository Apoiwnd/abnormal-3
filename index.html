<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非常论坛</title>
<style>
body { font-family: 'Georgia', serif; margin:0; padding:0;
       background: linear-gradient(135deg, #a8e6cf, #dcedc1); color:#333; }
header { text-align:center; padding:2rem 1rem; }
header h1 { font-size:4rem; margin:0; color:#0a3d0a; }
header p { font-size:1.2rem; color:#f7d948; margin-top:0.5rem; }
main { max-width:900px; margin:2rem auto; padding:0 1rem; }
.tabs { display:flex; gap:1rem; justify-content:center; margin-bottom:1rem; }
.tab-btn { padding:0.5rem 1rem; cursor:pointer; border-radius:8px; border:none;
          background-color:#4caf50; color:white; font-weight:bold; }
.tab-btn.active { background-color:#2e7d32; }
.new-post textarea { width:100%; height:80px; padding:0.5rem; border-radius:10px;
                    border:2px solid #4caf50; resize:none; margin-bottom:0.5rem; }
.new-post button { padding:0.5rem 1rem; border:none; border-radius:10px; background-color:#66bb6a;
                  color:white; font-weight:bold; cursor:pointer; }
.new-post button:hover { background-color:#388e3c; }
.posts { margin-top:2rem; }
.post { background: rgba(255,255,255,0.8); border:2px solid #4caf50; border-radius:15px;
       padding:1rem; margin-top:1.5rem; }
.post-content { margin-bottom:0.5rem; white-space:pre-wrap; }
.post-info { font-size:0.8rem; color:#555; margin-bottom:0.5rem; }
.post-actions { display:flex; gap:1rem; margin-bottom:0.5rem; }
button.action-btn { background:none; border:none; cursor:pointer; color:#2e7d32; font-weight:bold; }
button.action-btn:hover { text-decoration:underline; }
.comments { padding-left:1rem; border-left:2px dotted #4caf50; margin-top:0.5rem; }
.comment { margin-bottom:0.5rem; padding:0.3rem 0.5rem; background: rgba(198,239,206,0.5);
          border-radius:8px; font-size:0.9rem; }
</style>
</head>
<body>

<header>
  <h1>非常论坛</h1>
  <p>Apoiwnd</p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="sun">☀</button>
    <button class="tab-btn" data-tab="moon">🌙</button>
  </div>

  <section class="new-post">
    <textarea id="postContent" placeholder="说点什么吧..."></textarea>
    <button id="postBtn">发表</button>
  </section>

  <section id="posts" class="posts"></section>
</main>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyCsTIliAHbe2__LVrUkJyezY3JsNf79cAM",
  authDomain: "apoiwnd.firebaseapp.com",
  databaseURL: "https://apoiwnd-default-rtdb.firebaseio.com/",
  projectId: "apoiwnd",
  storageBucket: "apoiwnd.firebasestorage.app",
  messagingSenderId: "284452126195",
  appId: "1:284452126195:web:b644f75e4d37c14f29a686",
  measurementId: "G-CLG4SB1VTD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentTab = 'sun';
const postsContainer = document.getElementById('posts');
const postBtn = document.getElementById('postBtn');
const postContent = document.getElementById('postContent');
const tabButtons = document.querySelectorAll('.tab-btn');

function renderPosts(posts){
  postsContainer.innerHTML = '';
  const filtered = Object.entries(posts).filter(([id, post]) => post.tab === currentTab);
  filtered.forEach(([id, post]) => {
    const postEl = document.createElement('div');
    postEl.className = 'post';
    let commentsHTML = '';
    if(post.comments){
      commentsHTML = '<div class="comments">';
      post.comments.forEach(c => commentsHTML += `<div class="comment">💬 ${c}</div>`);
      commentsHTML += '</div>';
    }
    postEl.innerHTML = `
      <div class="post-content">${post.content}</div>
      <div class="post-info">发表时间: ${post.time}</div>
      <div class="post-actions">
        <button class="action-btn" onclick="likePost('${id}')">👍 ${post.likes||0}</button>
        <button class="action-btn" onclick="commentPost('${id}')">💬 评论</button>
      </div>
      ${commentsHTML}
    `;
    postsContainer.prepend(postEl);
  });
  if(postsContainer.firstChild) postsContainer.firstChild.scrollIntoView({behavior:'smooth'});
}

// 监听实时数据
onValue(ref(db, 'posts'), snapshot => {
  const data = snapshot.val() || {};
  renderPosts(data);
});

// 发帖
postBtn.addEventListener('click', () => {
  const content = postContent.value.trim();
  if(content){
    const timeStr = new Date().toLocaleString();
    push(ref(db, 'posts'), { tab: currentTab, content, likes:0, comments:[], time: timeStr });
    postContent.value = '';
  } else alert('请输入内容');
});

// 切换分区
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
  });
});

// 点赞和评论
window.likePost = function(postId){
  const postRef = ref(db, 'posts/' + postId + '/likes');
  runTransaction(postRef, likes => (likes||0)+1);
}

window.commentPost = function(postId){
  const comment = prompt("输入你的评论：");
  if(comment){
    const commentsRef = ref(db, 'posts/' + postId + '/comments');
    runTransaction(commentsRef, c => { c = c||[]; c.push(comment); return c; });
  }
}
</script>

</body>
</html>
