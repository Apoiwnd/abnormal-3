<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>非常论坛</title>
<style>
body {
  margin: 0;
  font-family: "Microsoft YaHei", serif;
  background: linear-gradient(135deg, #3b2416, #6d4c2f);
  color: #f5e6c8;
}
.header {
  background: rgba(60, 30, 10, 0.9);
  padding: 20px;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  border-bottom: 4px solid #c89b5b;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.card {
  background: rgba(255, 248, 220, 0.08);
  border: 2px solid #c89b5b;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(4px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
textarea, input {
  width: 100%; box-sizing: border-box;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #c89b5b;
  margin-top: 10px;
  margin-bottom: 10px;
  font-size: 16px;
}
button {
  background: linear-gradient(180deg, #d4a45f, #8b5a2b);
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  margin-right: 10px;
  font-size: 14px;
}
button:hover { transform: scale(1.03); }
.post-title { font-size: 24px; font-weight: bold; cursor: pointer; }
.post-content { margin: 10px 0; white-space: pre-wrap; }
.actions { margin-top: 10px; }
.comment {
  background: rgba(255,255,255,0.06);
  border-left: 3px solid #d4a45f;
  padding: 8px 12px;
  margin-top: 8px;
  border-radius: 6px;
}
.hidden { display: none; }
.back-btn { margin-bottom: 20px; }
</style>
</head>
<body>
</html>
