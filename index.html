<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非常论坛</title>
<style>
body {
  font-family:'Georgia', serif;
  margin:0;
  padding:0;
  transition: background 0.5s;
}
header { text-align:center; padding:2rem 1rem; }
header h1 { font-size:4rem; margin:0; color:#fff; text-shadow:1px 1px 4px #333; }
header p { font-size:1.2rem; color:#ffeb3b; margin-top:0.5rem; }
main { max-width:900px; margin:2rem auto; padding:0 1rem; }
.tabs { display:flex; gap:1rem; justify-content:center; margin-bottom:1rem; }
.tab-btn { padding:0.5rem 1rem; cursor:pointer; border-radius:8px; border:none; font-weight:bold; color:white; }
.tab-btn.active.sun { background-color:#ff5722; }
.tab-btn.active.moon { background-color:#00bcd4; }
.new-post textarea { width:100%; height:80px; padding:0.5rem; border-radius:10px; border:2px solid #fff; resize:none; margin-bottom:0.5rem; background:rgba(255,255,255,0.8); }
.new-post button { padding:0.5rem 1rem; border:none; border-radius:10px; background-color:#ff9800; color:white; font-weight:bold; cursor:pointer; }
.new-post button:hover { background-color:#f57c00; }
.posts { margin-top:2rem; }
.post { background: rgba(255,255,255,0.85); border-radius:15px; padding:1rem; margin-top:1.5rem; }
.post-content { margin-bottom:0.5rem; white-space:pre-wrap; font-size:0.95rem; }
.post-info { font-size:0.8rem; color:#555; margin-bottom:0.5rem; }
.post-actions { display:flex; gap:1rem; margin-bottom:0.5rem; }
button.action-btn { background:none; border:none; cursor:pointer; color:#333; font-weight:bold; }
button.action-btn:hover { text-decoration:underline; }
.comments { padding-left:1rem; border-left:2px dotted #333; margin-top:0.5rem; }
.comment { margin-bottom:0.5rem; padding:0.3rem 0.5rem; background: rgba(200,200,200,0.5); border-radius:8px; font-size:0.9rem; }
.collapse-toggle { cursor:pointer; color:#007bff; font-weight:bold; margin-left:5px; }
</style>
</head>
<body>

<header>
  <h1>非常论坛</h1>
  <p>Apoiwnd</p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active sun" data-tab="sun">☀</button>
    <button class="tab-btn moon" data-tab="moon">🌙</button>
  </div>

  <section class="new-post">
    <textarea id="postContent" placeholder="说点什么吧..."></textarea>
    <button id="postBtn">发表</button>
  </section>

  <section id="posts" class="posts"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyCsTIliAHbe2__LVrUkJyezY3JsNf79cAM",
  authDomain: "apoiwnd.firebaseapp.com",
  databaseURL: "https://apoiwnd-default-rtdb.firebaseio.com/",
  projectId: "apoiwnd",
  storageBucket: "apoiwnd.firebasestorage.app",
  messagingSenderId: "284452126195",
  appId: "1:284452126195:web:b644f75e4d37c14f29a686",
  measurementId: "G-CLG4SB1VTD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentTab = 'sun';
let postCount = 0; // 楼层统计
const postsContainer = document.getElementById('posts');
const postBtn = document.getElementById('postBtn');
const postContent = document.getElementById('postContent');
const tabButtons = document.querySelectorAll('.tab-btn');

function updateBackground() {
  if(currentTab==='sun'){
    document.body.style.background = "linear-gradient(135deg, #ff5722, #ffeb3b)";
  } else {
    document.body.style.background = "linear-gradient(135deg, #00bcd4, #8bc34a)";
  }
}
updateBackground();

function renderPosts(postsData){
  postsContainer.innerHTML = '';
  const filtered = Object.entries(postsData).filter(([id, post]) => post.tab === currentTab);
  postCount = 0;
  filtered.forEach(([id, post]) => {
    postCount++;
    const postEl = document.createElement('div');
    postEl.className = 'post';

    let contentHTML = post.content;
    let collapsed = false;
    if(contentHTML.length > 200){
      collapsed = true;
      const shortText = contentHTML.substring(0,200) + "...";
      contentHTML = `<span class="short-text">${shortText}</span><span class="full-text" style="display:none;">${post.content}</span><span class="collapse-toggle" onclick="toggleText(this)">▶</span>`;
    }

    let commentsHTML = '';
    if(post.comments){
      commentsHTML = '<div class="comments">';
      post.comments.forEach((c,i) => {
        let cContent = c.content;
        let cCollapsed = false;
        if(cContent.length > 150){
          cCollapsed = true;
          const shortC = cContent.substring(0,150) + "...";
          cContent = `<span class="short-text">${shortC}</span><span class="full-text" style="display:none;">${c.content}</span><span class="collapse-toggle" onclick="toggleText(this)">▶</span>`;
        }
        commentsHTML += `<div class="comment"><strong>${i+1}l</strong> ${cContent} <button onclick="replyComment('${id}', ${i})">回复</button>`;
        // 楼中楼
        if(c.replies){
          commentsHTML += '<div class="comments">';
          c.replies.forEach((r,j)=>{
            commentsHTML += `<div class="comment"><strong>${j+1}l</strong> ${r}</div>`;
          });
          commentsHTML += '</div>';
        }
        commentsHTML += '</div>';
      });
      commentsHTML += '</div>';
    }

    postEl.innerHTML = `
      <div class="post-content"><strong>${postCount}L</strong> ${contentHTML}</div>
      <div class="post-info">发表时间: ${post.time}</div>
      <div class="post-actions">
        <button class="action-btn" onclick="likePost('${id}')">👍 ${post.likes||0}</button>
        <button class="action-btn" onclick="commentPost('${id}')">💬 评论</button>
      </div>
      ${commentsHTML}
    `;
    postsContainer.prepend(postEl);
  });
  if(postsContainer.firstChild) postsContainer.firstChild.scrollIntoView({behavior:'smooth'});
}

// 实时监听数据
onValue(ref(db, 'posts'), snapshot => {
  const data = snapshot.val() || {};
  renderPosts(data);
});

// 发帖
postBtn.addEventListener('click', () => {
  const content = postContent.value.trim();
  if(content){
    const timeStr = new Date().toLocaleString();
    push(ref(db, 'posts'), { tab: currentTab, content, likes:0, comments:[], time: timeStr });
    postContent.value = '';
  } else alert('请输入内容');
});

// 切换分区
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active','sun','moon'));
    btn.classList.add('active', btn.dataset.tab);
    currentTab = btn.dataset.tab;
    updateBackground();
  });
});

// 点赞和评论
window.likePost = function(postId){
  const postRef = ref(db, 'posts/' + postId + '/likes');
  runTransaction(postRef, likes => (likes||0)+1);
}

window.commentPost = function(postId){
  const commentText = prompt("输入你的评论：");
  if(commentText){
    const commentsRef = ref(db, 'posts/' + postId + '/comments');
    runTransaction(commentsRef, c => {
      c = c||[];
      c.push({content: commentText, replies: []});
      return c;
    });
  }
}

// 回复楼中楼
window.replyComment = function(postId, commentIndex){
  const replyText = prompt("回复该评论：");
  if(replyText){
    const commentRef = ref(db, `posts/${postId}/comments/${commentIndex}/replies`);
    runTransaction(commentRef, r => { r = r||[]; r.push(replyText); return r; });
  }
}

// 长文本展开
window.toggleText = function(el){
  const parent = el.parentElement;
  const shortText = parent.querySelector('.short-text');
  const fullText = parent.querySelector('.full-text');
  if(shortText.style.display === "none"){
    shortText.style.display = "";
    fullText.style.display = "none";
    el.textContent = "▶";
  } else {
    shortText.style.display = "none";
    fullText.style.display = "";
    el.textContent = "▼";
  }
}
</script>

</body>
</html>
