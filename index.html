<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非常論壇</title>
<style>
body { font-family:'Georgia', serif; margin:0; padding:0; transition: background 0.3s; }
header { text-align:center; padding:1.5rem 1rem; position: relative; }
header .flowers-top, header .flowers-bottom { display:flex; justify-content:center; flex-wrap:wrap; }
header .flowers-top span, header .flowers-bottom span { margin:0 2px; }
header h1 { font-size:3rem; margin:0.5rem 0; color:#fff; text-shadow:1px 1px 4px #333; }
header p { font-size:1rem; color:#ffeb3b; margin-top:0.3rem; cursor:pointer; }
@media (max-width:600px){
  header h1 { font-size:2rem; }
  header p { font-size:0.9rem; }
}
.tabs { display:flex; gap:1rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
.tab-btn { padding:0.5rem 1rem; cursor:pointer; border-radius:8px; border:none; font-weight:bold; color:white; }
.tab-btn.active.sun { background-color:#ff5722; }
.tab-btn.active.moon { background-color:#00bcd4; }
.tab-btn.active.star { background-color: #6a5acd; }
#trashBtn { font-size:1.2rem; cursor:pointer; margin-left:0.5rem; }
#searchBox { width:100%; padding:0.5rem; border-radius:10px; border:2px solid #ccc; margin-bottom:1rem; display:block; color:#555; }
#searchBox::placeholder { color:#aaa; }
.new-post textarea { width:100%; height:80px; padding:0.5rem; border-radius:10px; border:2px solid #fff; resize:none; margin-bottom:0.5rem; background:rgba(255,255,255,0.85); }
.new-post textarea::placeholder { color:#666; }
.new-post button { padding:0.5rem 1rem; border:none; border-radius:10px; background-color:#ff9800; color:white; font-weight:bold; cursor:pointer; }
.new-post button:hover { background-color:#f57c00; }
.posts { margin-top:2rem; }
.post { background: rgba(255,255,255,0.85); border-radius:15px; padding:1rem; margin-top:1.5rem; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.post-content { margin-bottom:0.5rem; white-space:pre-wrap; font-size:0.95rem; }
.post-info { font-size:0.8rem; color:#555; margin-bottom:0.5rem; }
.post-actions { display:flex; gap:1rem; margin-bottom:0.5rem; flex-wrap:wrap;}
button.action-btn { background:none; border:none; cursor:pointer; color:#333; font-weight:bold; }
button.action-btn:hover { text-decoration:underline; }
.comments { padding-left:1rem; border-left:2px dotted #333; margin-top:0.5rem; }
.comment { margin-bottom:0.5rem; padding:0.3rem 0.5rem; border-radius:8px; font-size:0.9rem; background:#d0f0fd; }
.collapse-toggle { cursor:pointer; color:#007bff; font-weight:bold; margin-left:5px; }
.reply-box { background:#a0e0f0; padding:0.5rem; border-radius:10px; margin-top:0.5rem; }
#trashScreen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; overflow:auto; z-index:1000; padding:2rem; }
#trashScreen h2 { text-align:center; margin-bottom:2rem; }
#backBtn { cursor:pointer; color:#0af; margin-bottom:1rem; display:inline-block; }
</style>
</head>
<body>

<header>
  <div class="flowers-top">
    <span>🌸</span><span>🌺</span><span>🌼</span><span>🌷</span><span>🌹</span>
  </div>
  <h1>飛常論壇</h1>
  <p id="apoiwndBtn">APOIWND</p>
  <div class="flowers-bottom">
    <span>🌸</span><span>🌺</span><span>🌼</span><span>🌷</span><span>🌹</span>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn star active" data-tab="star">⭐ 星星</button>
    <button class="tab-btn sun" data-tab="sun">☀ 太阳</button>
    <button class="tab-btn moon" data-tab="moon">🌙 月亮</button>
    <span id="trashBtn">🗑</span>
  </div>

  <input type="text" id="searchBox" placeholder="你想回忆什么？🤷‍♂️">

  <section class="new-post">
    <textarea id="postContent" placeholder="大狗大狗叫叫叫"></textarea>
    <button id="postBtn">发表</button>
  </section>

  <section id="posts" class="posts"></section>
</main>

<section id="trashScreen">
  <h2>我们都是被抛弃的</h2>
  <span id="backBtn">⬅ 返回论坛</span>
  <div id="trashContent"></div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsTIliAHbe2__LVrUkJyezY3JsNf79cAM",
  authDomain: "apoiwnd.firebaseapp.com",
  databaseURL: "https://apoiwnd-default-rtdb.firebaseio.com/",
  projectId: "apoiwnd",
  storageBucket: "apoiwnd.firebasestorage.app",
  messagingSenderId: "284452126195",
  appId: "1:284452126195:web:b644f75e4d37c14f29a686",
  measurementId: "G-CLG4SB1VTD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentTab = 'star';
let currentUser = '';
let isAdmin = false;
const postsContainer = document.getElementById('posts');
const postBtn = document.getElementById('postBtn');
const postContent = document.getElementById('postContent');
const tabButtons = document.querySelectorAll('.tab-btn');
const searchBox = document.getElementById('searchBox');
const trashScreen = document.getElementById('trashScreen');
const trashContent = document.getElementById('trashContent');
const trashBtn = document.getElementById('trashBtn');
const backBtn = document.getElementById('backBtn');
const apoiwndBtn = document.getElementById('apoiwndBtn');

apoiwndBtn.addEventListener('click', ()=>{
    const pwd = prompt("请输入超级管理员密码：");
    if(pwd === "94084vzjj"){
        alert("已获得超级权限，可删除所有帖子！");
        isAdmin = true;
    } else {
        alert("密码错误，无法获得权限。");
    }
});

function login(tab){
  if(tab==='sun'){
    const pw = prompt("请输入太阳模块密码：");
    if(pw !== "太阳"){ alert("密码错误"); return false; }
  }
  if(tab==='moon'){
    const pw = prompt("请输入月亮模块密码：");
    if(pw !== "月亮"){ alert("密码错误"); return false; }
  }
  currentUser = prompt("请输入昵称（用于删除权限）","匿名");
  return true;
}

function updateBackground(){
  if(currentTab==='sun'){ document.body.style.background = "linear-gradient(135deg,#ff5722,#ffeb3b)"; searchBox.style.display='none'; }
  else if(currentTab==='moon'){ document.body.style.background = "linear-gradient(135deg,#00bcd4,#8bc34a)"; searchBox.style.display='none'; }
  else if(currentTab==='star'){ document.body.style.background = "linear-gradient(135deg,#add8e6,#ffcccc)"; searchBox.style.display='block'; }
}
updateBackground();

tabButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.tab!=='star' && !login(btn.dataset.tab)) return;
    tabButtons.forEach(b=>b.classList.remove('active','sun','moon','star'));
    btn.classList.add('active', btn.dataset.tab);
    currentTab = btn.dataset.tab;
    trashScreen.style.display='none';
    updateBackground();
  });
});

trashBtn.addEventListener('click', ()=>{
  trashScreen.style.display='block';
  updateTrash();
});

backBtn.addEventListener('click', ()=>{
  trashScreen.style.display='none';
});

function renderPosts(postsData){
  postsContainer.innerHTML='';
  let filtered = Object.entries(postsData||{}).filter(([id,post])=>post.tab===currentTab && !post.deleted);
  if(currentTab==='star' && searchBox.value){
    filtered = filtered.filter(([id,post])=>post.content.includes(searchBox.value));
  }
  let postCount=0;
  filtered.forEach(([id,post])=>{
    postCount++;
    const postEl=document.createElement('div'); postEl.className='post';
    let contentHTML=post.content;
    if(contentHTML.length>200){
      const shortText=contentHTML.substring(0,200)+'...';
      contentHTML=`<span class="short-text">${shortText}</span><span class="full-text" style="display:none;">${post.content}</span><span class="collapse-toggle" onclick="toggleText(this)">▶</span>`;
    }
    let commentsHTML='';
    if(post.comments){
      commentsHTML='<div class="comments">';
      post.comments.forEach((c,i)=>{
        let cContent=c.content;
        if(cContent.length>150){
          const shortC=cContent.substring(0,150)+'...';
          cContent=`<span class="short-text">${shortC}</span><span class="full-text" style="display:none;">${c.content}</span><span class="collapse-toggle" onclick="toggleText(this)">▶</span>`;
        }
        commentsHTML+=`<div class="comment"><strong>${i+1}l</strong> ${cContent} <button onclick="replyComment('${id}',${i})">回复</button></div>`;
        if(c.replies){
          commentsHTML+='<div class="comments">';
          c.replies.forEach((r,j)=>{commentsHTML+=`<div class="comment"><strong>${j+1}l</strong> ${r}</div>`;});
          commentsHTML+='</div>';
        }
      });
      commentsHTML+='</div>';
    }
    let deleteBtn='';
    if(isAdmin || post.user===currentUser) deleteBtn=`<button onclick="deletePost('${id}')">删除</button>`;
    postEl.innerHTML=`<div class="post-content"><strong>${postCount}L</strong> ${contentHTML}</div><div class="post-info">发表时间: ${post.time}</div><div class="post-actions"><button class="action-btn" onclick="likePost('${id}')">👍 ${post.likes||0}</button> ${deleteBtn}</div>${commentsHTML}`;
    postsContainer.prepend(postEl);
  });
}

function updateTrash(){
  trashContent.innerHTML='';
  onValue(ref(db,'posts'),snapshot=>{
    const data=snapshot.val()||{};
    Object.entries(data).forEach(([id,post])=>{
      if(post.deleted && post.tab===currentTab){
        const postEl = document.createElement('div');
        postEl.className='post';
        postEl.innerHTML=`<div class="post-content"><strong>${post.floor || ''}L</strong> ${post.content}</div><div class="post-info">发表时间: ${post.time}</div>`;
        trashContent.appendChild(postEl);
      }
    });
  });
}

onValue(ref(db,'posts'),snapshot=>{const data=snapshot.val()||{}; renderPosts(data);});

postBtn.addEventListener('click',()=>{
  const content = postContent.value.trim();
  if(!content){ alert('咯咯咯'); return; }
  const timeStr = new Date().toLocaleString();
  push(ref(db,'posts'),{tab:currentTab,content,likes:0,comments:[],time:timeStr,user:currentUser});
  postContent.value='';
});

window.likePost=function(postId){ runTransaction(ref(db,'posts/'+postId+'/likes'),likes=>(likes||0)+1); }
window.commentPost=function(postId){ 
  const commentText = prompt("汪汪汪："); 
  if(!commentText) return;
  runTransaction(ref(db,'posts/'+postId+'/comments'),c=>{c=c||[]; c.push({content:commentText,replies:[],user:currentUser}); return c;});
}
window.replyComment=function(postId,commentIndex){
  const replyText=prompt("喵喵喵：");
  if(!replyText) return;
  runTransaction(ref(db,`posts/${postId}/comments/${commentIndex}/replies`),r=>{r=r||[]; r.push(replyText); return r;});
}
window.toggleText=function(el){ const parent=el.parentElement; const shortText=parent.querySelector('.short-text'); const fullText=parent.querySelector('.full-text'); if(shortText.style.display==="none"){shortText.style.display=""; fullText.style.display="none"; el.textContent="▶";}else{shortText.style.display="none"; fullText.style.display=""; el.textContent="▼";}}
window.deletePost=function(postId){ runTransaction(ref(db,'posts/'+postId+'/deleted'),()=>true);}
searchBox.addEventListener('input',()=>{onValue(ref(db,'posts'),snapshot=>{const data=snapshot.val()||{}; renderPosts(data);});});
</script>

</body>
</html>
