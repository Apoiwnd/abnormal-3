<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非常論壇</title>
<style>
body { 
    font-family:'Georgia', serif; 
    margin:0; 
    padding:0; 
    transition: background 0.3s; 
    background: linear-gradient(135deg, #fffacd, #ccffcc);
}
header { text-align:center; padding:1rem 0; }
header .flowers-top, header .flowers-bottom { display:flex; justify-content:center; flex-wrap:wrap; }
header .flowers-top span, header .flowers-bottom span { margin:0 2px; }
header h1 { font-size:3rem; color:#fff; text-shadow:1px 1px 4px #333; margin:0.5rem 0; }
header p, #bookBtn { font-size:1rem; color:#ffeb3b; cursor:pointer; margin-top:0.3rem; }
#bookBtn { display:inline-block; font-size:1.5rem; margin-left:10px; }
.module-title { writing-mode: vertical-rl; font-weight:bold; font-size:1.5rem; text-align:center; margin:1rem 0; display:none;}
.star-title { color: #7b68ee; }
.sun-title { color: red; } 
.moon-title { color: #b8860b; }
.tabs { display:flex; gap:1rem; justify-content:center; margin-bottom:1rem; flex-wrap:wrap; }
.tab-btn { padding:0.5rem 1rem; cursor:pointer; border-radius:8px; border:none; font-weight:bold; color:white; font-size:1.5rem;}
.tab-btn.active.star { background-color:#a0c4ff; }
.tab-btn.active.sun { background: linear-gradient(135deg,#ff5722,#ffeb3b);}
.tab-btn.active.moon { background: linear-gradient(135deg,#32cd32,#ffa500);}
#trashBtn { cursor:pointer; font-size:1.2rem; margin-left:0.5rem; }
#searchBox { width:100%; padding:0.5rem; border-radius:10px; border:2px solid #ccc; margin-bottom:1rem; color:#555; }
#searchBox::placeholder { color:#aaa; }
.new-post textarea { width:100%; height:80px; padding:0.5rem; border-radius:10px; border:2px solid #fff; resize:none; margin-bottom:0.5rem; background:rgba(255,255,255,0.85);}
.new-post textarea::placeholder { color:#666; }
.new-post button { padding:0.5rem 1rem; border:none; border-radius:10px; background-color:#ffa07a; color:white; font-weight:bold; cursor:pointer;} 
.new-post button:hover { background-color:#ff8c00; }
.posts { margin-top:1rem; }
.post { background: rgba(255,255,255,0.85); border-radius:15px; padding:1rem; margin-top:1rem; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.post.self .post-content { color: purple; } 
.post-content { margin-bottom:0.5rem; white-space:pre-wrap; }
.post-info { font-size:0.8rem; color:#555; margin-bottom:0.5rem; }
.post-actions { display:flex; gap:1rem; margin-bottom:0.5rem; flex-wrap:wrap; }
button.action-btn { background:none; border:none; cursor:pointer; color:#333; font-weight:bold; }
.comments { padding-left:1rem; border-left:2px dotted #333; margin-top:0.5rem; }
.comment { margin-bottom:0.5rem; padding:0.3rem 0.5rem; border-radius:8px; font-size:0.9rem; background:#d0f0fd; }
.reply-box { background:#a0e0f0; padding:0.5rem; border-radius:10px; margin-top:0.5rem; }
#trashScreen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; overflow:auto; z-index:1000; padding:2rem; }
#backBtn { cursor:pointer; color:#0af; margin-bottom:1rem; display:inline-block; }
#adminNotice { display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:yellow; color:red; padding:1.5rem; border-radius:10px; font-weight:bold; text-align:center; z-index:2000; font-size:1.2rem; font-family:'Arial', sans-serif; }
#closeNotice { cursor:pointer; margin-left:10px; }
.expand-btn { color:#0a0; cursor:pointer; font-weight:bold; margin-left:5px; }
.short-text{display:inline;}
.full-text{display:none;}
</style>
</head>
<body>

<header>
  <div class="flowers-top"><span>🌸</span><span>🌺</span><span>🌼</span><span>🌷</span><span>🌹</span></div>
  <h1>非常論壇</h1>
  <p id="apoiwndBtn">APOIWND</p><span id="bookBtn">📖</span>
  <div class="flowers-bottom"><span>🌸</span><span>🌺</span><span>🌼</span><span>🌷</span><span>🌹</span></div>
</header>

<main>
  <input type="text" id="searchBox" placeholder="你想回忆什么？🤷‍♀️">
  <div class="tabs">
    <button class="tab-btn star" data-tab="star">⭐</button>
    <button class="tab-btn sun" data-tab="sun">☀</button>
    <button class="tab-btn moon" data-tab="moon">🌙</button>
    <span id="trashBtn">🗑</span>
  </div>

  <section class="module-title star-title" id="starTitle">表象即是启示</section>
  <section class="module-title sun-title" id="sunTitle">金刚不敌</section>
  <section class="module-title moon-title" id="moonTitle">鸟儿在歌唱</section>

  <section class="new-post">
    <textarea id="postContent" placeholder="大狗大狗叫叫叫👍"></textarea>
    <button id="postBtn">无病呻吟...</button>
  </section>

  <section id="posts" class="posts"></section>
</main>

<section id="trashScreen">
  <h2>我们都是被抛弃的</h2>
  <span id="backBtn">⬅ 返回论坛</span>
  <div id="trashContent"></div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsTIliAHbe2__LVrUkJyezY3JsNf79cAM",
  authDomain: "apoiwnd.firebaseapp.com",
  databaseURL: "https://apoiwnd-default-rtdb.firebaseio.com/",
  projectId: "apoiwnd",
  storageBucket: "apoiwnd.firebasestorage.app",
  messagingSenderId: "284452126195",
  appId: "1:284452126195:web:b644f75e4d37c14f29a686"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentTab = '';
let currentUser = prompt("访问密码是 笨蛋：")||"匿名";
let isAdmin = JSON.parse(localStorage.getItem('isAdmin')||'false');

const postsContainer = document.getElementById('posts');
const tabButtons = document.querySelectorAll('.tab-btn');
const searchBox = document.getElementById('searchBox');
const starTitle = document.getElementById('starTitle');
const sunTitle = document.getElementById('sunTitle');
const moonTitle = document.getElementById('moonTitle');
const apoiwndBtn = document.getElementById('apoiwndBtn');
const bookBtn = document.getElementById('bookBtn');
const trashBtn = document.getElementById('trashBtn');
const trashScreen = document.getElementById('trashScreen');
const trashContent = document.getElementById('trashContent');

let lastData={};

// 超级管理员权限
apoiwndBtn.addEventListener('click',()=>{
    const pwd = prompt("请输入超级管理员密码：");
    if(pwd==="94084vzjj"){ isAdmin=true; localStorage.setItem('isAdmin',true); bookBtn.style.display='inline-block'; alert("已获得管理员权限"); } 
    else alert("多问问自己配不配");
});

// 模块切换
tabButtons.forEach(btn=>{
    btn.addEventListener('click',()=>{
        currentTab=btn.dataset.tab;
        tabButtons.forEach(b=>b.classList.remove('active','sun','moon','star'));
        btn.classList.add('active',btn.dataset.tab);
        starTitle.style.display=currentTab==='star'?'block':'none';
        sunTitle.style.display=currentTab==='sun'?'block':'none';
        moonTitle.style.display=currentTab==='moon'?'block':'none';
        searchBox.style.display='none';
        renderPosts(lastData);
    });
});

// 垃圾箱
trashBtn.addEventListener('click',()=>{ 
    trashScreen.style.display='block'; 
    renderTrash(lastData);
});
document.getElementById('backBtn').addEventListener('click',()=>{ trashScreen.style.display='none'; });

// Firebase 数据监听
onValue(ref(db,'posts'),snapshot=>{
    lastData=snapshot.val()||{};
    renderPosts(lastData);
    // 进入网页显示月亮模块随机帖
    if(!window.shownMoonNotice){
        window.shownMoonNotice=true;
        const moonPosts = Object.values(lastData).filter(p=>p.tab==='moon' && !p.deleted);
        if(moonPosts.length>0){
            const rand = moonPosts[Math.floor(Math.random()*moonPosts.length)];
            alert("🎠"+rand.content);
        }
    }
});

// 发帖
document.getElementById('postBtn').addEventListener('click',()=>{
    const content=document.getElementById('postContent').value.trim();
    if(!content) return;
    const timeStr=new Date().toLocaleString();
    push(ref(db,'posts'),{tab:currentTab||'star',content,likes:0,comments:[],time:timeStr,user:currentUser,deleted:false});
    document.getElementById('postContent').value='';
});

// 点赞
window.likePost=function(postId){ runTransaction(ref(db,'posts/'+postId+'/likes'),likes=>(likes||0)+1); }

// 删除仅管理员
window.deletePost=function(postId){ if(!isAdmin) return; runTransaction(ref(db,'posts/'+postId+'/deleted'),()=>true); }

// 回复帖子，最多两层
window.replyPost=function(postId){
    const text=prompt("喵喵喵：");
    if(!text) return;
    runTransaction(ref(db,`posts/${postId}/comments`),old=>{
        old=old||[];
        old.push({content:text,user:currentUser,replies:[]});
        return old;
    });
}

window.replyComment=function(postId,index){
    const text=prompt("汪汪汪：");
    if(!text) return;
    runTransaction(ref(db,`posts/${postId}/comments/${index}/replies`),old=>{
        old=old||[];
        if(old.length>=1) return old; // 只允许两层
        old.push({content:text,user:currentUser});
        return old;
    });
}

// 展开文本
function formatContent(text,isSelf){
    if(text.length<=100) return text;
    return `<span class="short-text">${text.slice(0,100)}</span><span class="full-text">${text.slice(100)}</span> <span class="expand-btn" onclick="toggleExpand(this)">展开</span>`;
}

window.toggleExpand=function(btn){
    const parent=btn.parentElement;
    parent.querySelector('.short-text').style.display = parent.querySelector('.short-text').style.display==='none'?'inline':'none';
    parent.querySelector('.full-text').style.display = parent.querySelector('.full-text').style.display==='none'?'inline':'none';
    btn.textContent = btn.textContent==='展开'?'收起':'展开';
}

// 渲染帖子
function renderPosts(data){
    postsContainer.innerHTML='';
    let entries=Object.entries(data||{}).filter(([id,p])=>p.tab===currentTab && !p.deleted);
    entries.forEach(([id,post],index)=>{
        const div=document.createElement('div');
        div.className='post'+(post.user===currentUser?' self':'');
        div.innerHTML=`<div class="post-content"><strong>${index+1}L</strong> ${formatContent(post.content, post.user===currentUser)}</div>
        <div class="post-info">发表时间: ${post.time}</div>
        <div class="post-actions">
        <button class="action-btn" onclick="likePost('${id}')">👍 ${post.likes||0}</button>
        ${(isAdmin)?`<button onclick="deletePost('${id}')">🚽</button>`:''}
        <button class="action-btn" onclick="replyPost('${id}')">異議あり！</button>
        </div>`;

        // 评论
        if(post.comments){
            let commentsHTML='<div class="comments">';
            post.comments.forEach((c,i)=>{
                const firstLayer = `<div class="comment"><strong>${i+1}l</strong> ${c.content} ${(isAdmin)?`<button onclick="deleteComment('${id}',${i})">删除</button>`:''} <button onclick="replyComment('${id}',${i})">回复</button></div>`;
                commentsHTML+=firstLayer;
                if(c.replies && c.replies.length>0){
                    commentsHTML+='<div class="comments">';
                    c.replies.forEach((r,j)=>{
                        const content = r.content || r;
                        commentsHTML+=`<div class="comment">${content} ${(isAdmin)?`<button onclick="deleteReply('${id}',${i},${j})">删除</button>`:''}</div>`;
                    });
                    commentsHTML+='</div>';
                }
            });
            commentsHTML+='</div>';
            div.innerHTML+=commentsHTML;
        }

        postsContainer.prepend(div);
    });
}

// 垃圾箱
function renderTrash(data){
    trashContent.innerHTML='';
    let entries=Object.entries(data||{}).filter(([id,p])=>p.deleted);
    entries.forEach(([id,post])=>{
        const div=document.createElement('div');
        div.className='post';
        div.innerHTML=`<div class="post-content"><strong>${post.tab}模块</strong> ${post.content}</div>
        <div class="post-info">发表时间: ${post.time}</div>
        ${(isAdmin)?`<button onclick="deletePost('${id}')">失落招魂</button>`:''}`;
        trashContent.prepend(div);
    });
}
</script>

</body>
</html>
