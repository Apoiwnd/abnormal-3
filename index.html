<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非常论坛</title>
<style>
/* 全局复古穆夏风格 */
body {
  font-family: 'Georgia', serif;
  background: #fef6e4 url('https://i.imgur.com/W1K9zJ2.jpg') no-repeat center top;
  background-size: cover;
  color: #4b3c2a;
  margin: 0;
  padding: 0;
}

header {
  text-align: center;
  padding: 2rem 1rem;
  background: rgba(255, 248, 220, 0.9);
  border-bottom: 3px solid #c19a6b;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

header h1 {
  font-family: 'Palatino Linotype', serif;
  font-size: 3rem;
  margin: 0;
  color: #7c4a2f;
  text-shadow: 2px 2px 0 #f4e1c1;
}

header p {
  font-style: italic;
  margin-top: 0.5rem;
}

main {
  max-width: 800px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.new-post textarea {
  width: 100%;
  height: 100px;
  font-size: 1rem;
  padding: 0.5rem;
  border: 3px solid #c19a6b;
  border-radius: 15px;
  resize: none;
  background: rgba(255,250,240,0.7);
}

.new-post button {
  margin-top: 0.5rem;
  padding: 0.5rem 1rem;
  font-size: 1rem;
  border: none;
  border-radius: 15px;
  background: linear-gradient(135deg, #d4a373, #b8734f);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 3px 5px rgba(0,0,0,0.2);
}

.new-post button:hover {
  background: linear-gradient(135deg, #b8734f, #d4a373);
}

.posts {
  margin-top: 2rem;
}

.post {
  background: rgba(255, 250, 240, 0.9);
  border: 3px solid #c19a6b;
  border-radius: 20px;
  padding: 1rem 1.2rem;
  margin-top: 1.5rem;
  position: relative;
  box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
  animation: fadeIn 0.5s ease-in-out;
}

.post-content {
  font-size: 1.1rem;
  margin-bottom: 0.8rem;
  white-space: pre-wrap;
}

.post-actions {
  display: flex;
  gap: 1rem;
  font-size: 0.9rem;
  align-items: center;
}

button.action-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #7c4a2f;
  font-weight: bold;
}

button.action-btn:hover {
  text-decoration: underline;
}

.comments {
  margin-top: 0.8rem;
  padding-left: 1rem;
  border-left: 2px dotted #c19a6b;
}

.comment {
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
  background: rgba(244,225,193,0.3);
  padding: 0.3rem 0.5rem;
  border-radius: 10px;
}

/* 动画效果 */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>
<header>
  <h1>非常论坛</h1>
  <p>匿名发言 · 复古华丽 · 穆夏风格</p>
</header>

<main>
  <section class="new-post">
    <textarea id="postContent" placeholder="说点什么吧..."></textarea>
    <button id="postBtn">发表</button>
  </section>

  <section id="posts" class="posts">
    <!-- 帖子会动态插入这里 -->
  </section>
</main>

<script>
// 模拟数据库
let posts = JSON.parse(localStorage.getItem('posts')) || [];

const postsContainer = document.getElementById('posts');
const postBtn = document.getElementById('postBtn');
const postContent = document.getElementById('postContent');

function savePosts() {
  localStorage.setItem('posts', JSON.stringify(posts));
}

function renderPosts() {
  postsContainer.innerHTML = '';
  posts.forEach((post, index) => {
    const postEl = document.createElement('div');
    postEl.className = 'post';

    // 渲染评论
    let commentsHTML = '';
    if(post.comments.length > 0){
      commentsHTML = '<div class="comments">';
      post.comments.forEach(c => {
        commentsHTML += `<div class="comment">💬 ${c}</div>`;
      });
      commentsHTML += '</div>';
    }

    postEl.innerHTML = `
      <div class="post-content">${post.content}</div>
      <div class="post-actions">
        <button class="action-btn" onclick="likePost(${index})">👍 ${post.likes}</button>
        <button class="action-btn" onclick="commentPost(${index})">💬 评论</button>
      </div>
      ${commentsHTML}
    `;
    postsContainer.prepend(postEl);
  });

  // 自动滚动到最新帖子
  if(postsContainer.firstChild){
    postsContainer.firstChild.scrollIntoView({behavior: 'smooth'});
  }
}

function likePost(index) {
  posts[index].likes += 1;
  savePosts();
  renderPosts();
}

function commentPost(index) {
  const comment = prompt("输入你的评论：");
  if(comment){
    posts[index].comments.push(comment);
    savePosts();
    renderPosts();
  }
}

postBtn.addEventListener('click', () => {
  const content = postContent.value.trim();
  if(content){
    posts.push({ content, likes: 0, comments: [] });
    savePosts();
    postContent.value = '';
    renderPosts();
  } else {
    alert('请输入内容');
  }
});

renderPosts();
</script>
</body>
</html>
